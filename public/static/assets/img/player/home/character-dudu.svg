<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Shadow -->
  <ellipse cx="150" cy="275" rx="85" ry="16" fill="#1f5c8d18" />

  <!-- Dudu the Cute Brown Bear Body -->
  <g id="dudu-bear">
    <!-- Left Ear -->
    <circle cx="85" cy="80" r="34" fill="#8f5b3a" stroke="#4a2c18" stroke-width="6" />
    <circle cx="85" cy="80" r="20" fill="#d99f77" />

    <!-- Right Ear -->
    <circle cx="215" cy="80" r="34" fill="#8f5b3a" stroke="#4a2c18" stroke-width="6" />
    <circle cx="215" cy="80" r="20" fill="#d99f77" />

    <!-- Head -->
    <path d="M 60,150 C 45,95 255,95 240,150 C 255,215 45,215 60,150 Z" 
          fill="#a46d47" stroke="#4a2c18" stroke-width="7" />

    <!-- Body & Arms -->
    <path d="M 85,185 C 65,225 65,260 90,265 C 120,270 180,270 210,265 C 235,260 235,225 215,185 Z" 
          fill="#8f5b3a" stroke="#4a2c18" stroke-width="7" />

    <!-- Belly -->
    <ellipse cx="150" cy="235" rx="46" ry="30" fill="#e8c7aa" stroke="#4a2c18" stroke-width="5" />

    <!-- Muzzle / Snout -->
    <ellipse cx="150" cy="162" rx="38" ry="26" fill="#f3dfcb" stroke="#4a2c18" stroke-width="5" />

    <!-- Cute Nose & Smile -->
    <ellipse cx="150" cy="154" rx="10" ry="7" fill="#2d170a" />
    <path d="M 150,161 L 150,169 M 142,168 C 146,174 154,174 158,168" 
          fill="none" stroke="#2d170a" stroke-width="4.5" stroke-linecap="round" />

    <!-- Happy Cute Eyes -->
    <ellipse cx="112" cy="140" rx="9" ry="12" fill="#2d170a" />
    <circle cx="109" cy="136" r="3.5" fill="#ffffff" />
    <ellipse cx="188" cy="140" rx="9" ry="12" fill="#2d170a" />
    <circle cx="185" cy="136" r="3.5" fill="#ffffff" />

    <!-- Cute Rosy Blushing Cheeks -->
    <ellipse cx="92" cy="162" rx="14" ry="9" fill="#ff7597" opacity="0.75" />
    <ellipse cx="208" cy="162" rx="14" ry="9" fill="#ff7597" opacity="0.75" />

    <!-- Little Paws resting on bottom -->
    <ellipse cx="118" cy="260" rx="18" ry="12" fill="#d99f77" stroke="#4a2c18" stroke-width="5" />
    <ellipse cx="182" cy="260" rx="18" ry="12" fill="#d99f77" stroke="#4a2c18" stroke-width="5" />

    <!-- Cute Mint Bowtie / Collar -->
    <path d="M 132,190 L 150,196 L 168,190 L 168,202 L 150,196 L 132,202 Z" 
          fill="#34d399" stroke="#047857" stroke-width="4" stroke-linejoin="round" />
    <circle cx="150" cy="196" r="5" fill="#10b981" stroke="#047857" stroke-width="3" />
  </g>
</svg>
